# SmartWordlist Default Mutation Rules
# Customize by passing --rules <path> to override any section.

leet_map:
  a:
    - "4"
    - "@"
  b:
    - "8"
    - "6"
  e:
    - "3"
  g:
    - "9"
    - "6"
  i:
    - "1"
    - "!"
  l:
    - "1"
  o:
    - "0"
  s:
    - "5"
    - "$"
  t:
    - "7"
  z:
    - "2"

suffixes:
  - "123"
  - "!"
  - "@"
  - "#"
  - "$"

prefixes:
  - "admin_"
  - "dev_"
  - "test_"
  - "user_"

year_range:
  start: 2015
  end: 2026

case_variations:
  - lower
  - upper
  - title
