# openspec/config.yaml
schema: spec-driven

context: |
  Project: SmartWordlist (formerly bruteForceBasedOnIA)
  Git remote: bruteforcebasedonia
  Tech stack: NOT SELECTED — candidate languages are Go or Rust
  Architecture: None yet — to be determined
  Testing: No test runner detected — language decision blocks test tool selection
  Style: Not established yet

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false           # No test runner available; set to true once stack chosen
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  available: false
  runner: null
  layers: []
  coverage_enabled: false
  linter: null
  type_checker: null
  formatter: null
  strict_tdd: false
  note: >
    No test runner or language stack detected. Strict TDD is disabled until
    a language (Go or Rust) is chosen and the corresponding toolchain is
    installed. When Go is selected, 'go test' becomes available with
    built-in coverage. When Rust is selected, 'cargo test' becomes available
    with 'tarpaulin' or 'llvm-cov' for coverage.
